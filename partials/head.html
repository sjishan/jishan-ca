<!-- partials/head.html injected at the CHROME:HEAD marker into every page head.
     Holds: Google Analytics, optional Search Console meta, and all shared CSS for the
     site chrome (header/footer) and the inline subscribe section.
     Edit once; every page updates on the next build. -->

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-CQ24Y0GHQM"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-CQ24Y0GHQM');
</script>

<!-- Google Search Console: prefer verifying the whole domain via a DNS TXT record.
     If you verify by HTML tag instead, uncomment and paste your token:
<meta name="google-site-verification" content="YOUR_TOKEN"> -->

<!-- Favicon: real files (Google/WhatsApp/Messenger require crawlable icons, not data: URIs).
     pine-green rounded square with a white "J" monogram. -->
<link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16">
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/assets/site.webmanifest">

<style>
  /* smooth in-page anchor scrolling (e.g. About), disabled when the user prefers reduced motion */
  @media (prefers-reduced-motion:no-preference){ html{scroll-behavior:smooth;} }

  /* ---------- site header ---------- */
  .jx-head{position:sticky;top:0;z-index:40;width:100%;background:rgba(255,255,255,.86);
    -webkit-backdrop-filter:saturate(150%) blur(8px);backdrop-filter:saturate(150%) blur(8px);
    border-bottom:1px solid #E9ECE3;font-family:"IBM Plex Sans",Arial,sans-serif;}
  .jx-in{width:100%;max-width:1120px;margin:0 auto;padding:0 36px;display:flex;align-items:center;justify-content:space-between;height:58px;}
  .jx-brand{font-weight:700;font-size:16px;letter-spacing:-.01em;color:#181A15;text-decoration:none;white-space:nowrap;border:0;}
  .jx-brand span{color:#0C6A52;}
  .jx-nav{display:flex;align-items:center;gap:22px;}
  .jx-nav a{font-size:14.5px;font-weight:600;color:#6A6F64;text-decoration:none;border:0;}
  .jx-nav a:hover{color:#181A15;}
  .jx-nav .jx-li{display:flex;align-items:center;color:#6A6F64;}
  .jx-nav .jx-li svg{width:17px;height:17px;display:block;fill:currentColor;}
  .jx-nav .jx-li:hover{color:#08493A;}
  .jx-head a:focus-visible{outline:2px solid #0C6A52;outline-offset:3px;border-radius:4px;}

  /* ---------- site footer ---------- */
  .jx-foot{width:100%;background:#FFFFFF;font-family:"IBM Plex Sans",Arial,sans-serif;}
  .jx-foot-in{width:100%;max-width:1120px;margin:0 auto;padding:30px 36px 44px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px;}
  .jx-fl{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;}
  .jx-fl a{font-weight:600;color:#6A6F64;text-decoration:none;border:0;}
  .jx-fl a:hover{color:#08493A;}
  .jx-copy{font-family:"IBM Plex Mono",monospace;font-size:12px;color:#A7ABA1;letter-spacing:.02em;white-space:nowrap;}

  /* ---------- inline subscribe ---------- */
  .jx-sub{width:100%;max-width:1120px;margin:0 auto;padding:40px 36px 32px;border-top:1px solid #E9ECE3;font-family:"IBM Plex Sans",Arial,sans-serif;}
  .jx-sub-in{max-width:620px;}
  .jx-sub-h{font-size:clamp(20px,2.4vw,26px);line-height:1.15;letter-spacing:-.015em;font-weight:700;color:#181A15;margin:0 0 18px;}
  .jx-sub-p{font-size:16px;line-height:1.5;color:#6A6F64;margin:0 0 18px;}
  .jx-sub-form{margin:0;}
  .jx-sub-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  .jx-sub-row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;}
  .jx-sub-input{flex:1 1 240px;min-width:0;font-family:inherit;font-size:16px;color:#181A15;background:#fff;border:1px solid #D8DCD2;border-radius:999px;padding:12px 18px;line-height:1.2;transition:border-color .15s ease;}
  .jx-sub-input::placeholder{color:#A7ABA1;}
  .jx-sub-input:focus{outline:none;border-color:#0C6A52;box-shadow:0 0 0 3px rgba(12,106,82,.12);}
  .jx-sub-btn{font-family:inherit;font-size:15.5px;font-weight:600;color:#fff;background:#0C6A52;border:1px solid #0C6A52;border-radius:999px;padding:12px 24px;cursor:pointer;white-space:nowrap;transition:background .15s ease,border-color .15s ease;}
  .jx-sub-btn:hover{background:#08493A;border-color:#08493A;}
  .jx-sub-btn:focus-visible,.jx-sub-input:focus-visible{outline:2px solid #0C6A52;outline-offset:3px;}
  .jx-sub-note{font-size:13.5px;line-height:1.4;color:#6A6F64;margin:11px 0 0;min-height:1.2em;}
  .jx-sub-note.ok{color:#08493A;font-weight:600;}

  /* framed visual pages: fit the stepper under the 58px header on small screens */
  @media (max-width:899px){ .stage{ min-height:calc(100svh - 58px); } }

  @media (max-width:760px){
    .jx-in{padding:0 22px;}
    .jx-foot-in{padding:26px 22px 38px;}
    .jx-nav{gap:16px;}
    .jx-sub{padding:32px 22px 26px;}
    .jx-sub-btn{flex:1 1 100%;}
  }
  @media (prefers-reduced-motion:reduce){ .jx-sub-input,.jx-sub-btn{transition:none;} }
</style>
